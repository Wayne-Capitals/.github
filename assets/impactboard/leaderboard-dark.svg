<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      .leaderboard-title { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 18px; fill: #c9d1d9; }
      .leaderboard-rank { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 14px; fill: #c9d1d9; }
      .leaderboard-name { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; fill: #c9d1d9; }
      .leaderboard-score { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 12px; fill: #c9d1d9; opacity: 0.8; }
      .leaderboard-badge { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 11px; }
      
      .bar-fill {
        animation: grow 0.8s ease-out forwards;
        transform-origin: left;
      }
      @keyframes grow {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      
    </style>
    <linearGradient id="barGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#58a6ff;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" rx="12" fill="#0d1117"/>
  
  <!-- Border -->
  <rect width="800" height="400" rx="12" fill="none" stroke="#21262d" stroke-width="1"/>
  
  <!-- Title -->
  <text x="20" y="44" class="leaderboard-title">Wayne-Capitals Top Contributors</text>
  
  <!-- Entries -->
  
</svg>